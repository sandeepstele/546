# ---------------------------------------------------------------------------
# Does the Route Matter? - experiment configuration
# Edit this file, not the code. Every script reads it.
# ---------------------------------------------------------------------------

data:
  hf_dataset: PardisSzah/FaithConflict
  hf_config: null          # dataset subset name, if the dataset has several
  hf_split: null           # null = load and combine every split
  local_path: null         # optional: a local CSV / JSON / JSONL / Parquet file instead of Hugging Face
  normalized_path: data/faithconflict.jsonl

  # Column names in the raw data. Leave null to auto-detect.
  # Run `python -m src.data --inspect` to see the real column names.
  columns:
    # "long" format: one row per document
    pair_id: null
    category: null
    group: null
    polarity: null           # which version of the pair this row is (confirming / opposing)
    claim: null
    document: null
    question: null
    # "wide" format: one row per pair (fill these instead of polarity/claim/document)
    confirming_document: null
    opposing_document: null
    confirming_claim: null
    opposing_claim: null

  # category name -> one of: safety, capability, subjective.
  # Leave empty to auto-map from category names by keyword.
  # Fill it in if `--inspect` shows codes like C1..C10 instead of names.
  category_groups: {}

  # Used only if the data has no question column. Match your pilot's exact wording.
  question_template: "Based solely on what this document states, what does this study conclude about whether {claim}?"

prompt:
  instruction: "Report only what the document says. Do not add your own knowledge or judgment."
  tool_description: "Returns the full text of a stored research document, verbatim and unmodified."

run:
  # Ladder: C1 Direct (D0) -> C2 Reshaped (D1) -> T1 Tool-injected (channel) -> C3 Tool (agency, T2)
  conditions: [C1, C2, T1, C3, C4, C5]   # C6 = constrained agent (stretch)
  temperature: 0
  max_tokens: 400
  concurrency: 8
  max_tool_turns: 3        # C3: tool rounds before the model must answer
  agent_max_turns: 5       # C6: total model turns
  rag_top_k: 3             # C5: retrieved documents
  agent_search_k: 5        # C6: results per search
  force_tool_call: false   # C3: true = force read_document on the first turn (not all providers support it)
  output_dir: outputs
  seed: 13

models:
  # `provider` picks the client (src/llm.py): openai (default, any OpenAI-compatible API),
  # vertex_openai (Vertex AI, gcloud ADC auth), anthropic (Claude API), anthropic_vertex (Claude on Vertex).

  # --- Claude API (Anthropic SDK). Key: ANTHROPIC_API_KEY in .env.
  claude_sonnet46:
    provider: anthropic
    model: claude-sonnet-4-6
    api_key_env: ANTHROPIC_API_KEY
    # Kept on API version 2023-06-01 so temperature 0 is accepted (2026-10-21 rejects temperature).
    anthropic_version: "2023-06-01"

  # --- Claude on Vertex AI (same model, Google billing). Needs Sonnet 4.6 enabled in Model Garden
  # and a non-zero quota (global_online_prediction_requests_per_base_model); 0 by default on new projects.
  claude_sonnet46_vertex:
    provider: anthropic_vertex
    model: claude-sonnet-4-6
    region: global
    project_env: GOOGLE_CLOUD_PROJECT
    anthropic_version: vertex-2023-10-16

  # --- Gemini on Vertex AI, OpenAI-compatible endpoint. Auth: gcloud ADC
  # (`gcloud auth application-default login` locally; automatic in Colab Enterprise).
  gemini35_flash:
    provider: vertex_openai
    model: google/gemini-3.5-flash
    location: global
    project_env: GOOGLE_CLOUD_PROJECT
    extra_body:
      extra_body: {google: {thinking_config: {thinking_budget: 0}}}   # thinking off (verified: 0 reasoning tokens)
    # Gemini 3 rejects a function call in history without a thought signature. The T1 call is written by
    # the harness, so it carries Google's documented placeholder signature.
    injected_tool_call_extra:
      extra_content: {google: {thought_signature: skip_thought_signature_validator}}

  # Same Gemini model through the Gemini Developer API with an API key (no gcloud needed).
  gemini35_flash_apikey:
    model: gemini-3.5-flash
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    extra_body:
      extra_body: {google: {thinking_config: {thinking_budget: 0}}}
    injected_tool_call_extra:
      extra_content: {google: {thought_signature: skip_thought_signature_validator}}

  gpt4o:
    model: gpt-4o-2024-08-06     # set to the exact snapshot your pilot used
    base_url: null               # null = OpenAI
    api_key_env: OPENAI_API_KEY

  qwen35_9b:
    model: qwen/qwen3.5-9b       # check the exact id on OpenRouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    extra_body:
      reasoning: {enabled: false}   # turn thinking off; verify in the smoke test

  gemma4_12b:
    model: google/gemma-4-12b-it   # check the exact id on your provider
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY

  # Groq free tier (OpenAI-compatible). Check current ids at https://console.groq.com/docs/models
  groq_qwen27b:
    model: qwen/qwen3.8-27b
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    extra_body:
      reasoning_effort: none        # thinking off, like the other Qwen entries

  groq_gptoss20b:
    model: openai/gpt-oss-20b
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    extra_body:
      reasoning_effort: low         # gpt-oss always reasons; keep it short so answers fit max_tokens
      include_reasoning: false

  # Self-hosted alternative (Delta / Colab), via vLLM's OpenAI-compatible server
  qwen35_9b_vllm:
    model: Qwen/Qwen3.5-9B
    base_url: http://localhost:8000/v1
    api_key_env: VLLM_API_KEY
    extra_body:
      chat_template_kwargs: {enable_thinking: false}

  gemma4_12b_vllm:
    model: google/gemma-4-12B-it
    base_url: http://localhost:8000/v1
    api_key_env: VLLM_API_KEY

  # Plan's open-weights scaling pair, served with vLLM on DeltaAI (docs/DELTAAI_SETUP.md).
  # Not served on Vertex AI any more. Llama 3.1 has no thinking mode; tool calls use vLLM's llama3_json parser.
  llama31_8b_vllm:
    model: meta-llama/Llama-3.1-8B-Instruct
    base_url: http://localhost:8000/v1
    api_key_env: VLLM_API_KEY

  llama31_70b_vllm:
    model: meta-llama/Llama-3.1-70B-Instruct
    base_url: http://localhost:8000/v1
    api_key_env: VLLM_API_KEY

  # --- Open-weights models, pay-per-token on Vertex AI (no deployment). Auth: gcloud ADC.
  # Probed 2026-11-25: temperature 0 accepted, tool calls work, no reasoning in the reply.
  gemma4_26b:
    provider: vertex_openai
    model: google/gemma-4-26b-a4b-it-maas      # Google, Gemma 4 26B MoE (4B active)
    location: global
    project_env: GOOGLE_CLOUD_PROJECT

  deepseek_v41_flash:
    provider: vertex_openai
    model: deepseek-ai/deepseek-v4.1-flash-maas
    location: global
    project_env: GOOGLE_CLOUD_PROJECT

  # Mistral is a partner model: enabled once in Model Garden, served only in europe-west4 for this
  # project, and only at :rawPredict (not the openapi endpoint). It takes 9-character alphanumeric
  # tool-call ids, so the harness-written T1 call gets one.
  mistral_small31:
    provider: vertex_openai
    raw_predict: mistralai
    model: mistral-small-2503                   # Mistral Small 3.1 (25.03), 24B
    location: europe-west4
    project_env: GOOGLE_CLOUD_PROJECT
    injected_tool_call_extra: {id: t1readdoc}
    # This project's quota for the model is 60 requests/min (and 200k tokens/min) in europe-west4.
    # max_rpm paces requests just under it, so calls are not rejected with 429 and rows are not lost
    # to used-up retries. A full run (about 13,200 requests) therefore takes about 4 hours, whatever
    # the concurrency. Raise this if the quota is raised.
    max_rpm: 58

  # Spare third family if Mistral misbehaves: GLM-5.2 reasons by default; this turns it off (verified).
  glm52:
    provider: vertex_openai
    model: zai-org/glm-5.2-maas
    location: global
    project_env: GOOGLE_CLOUD_PROJECT
    extra_body: {chat_template_kwargs: {enable_thinking: false}}

  # Same pair self-deployed on Vertex AI Model Garden (vLLM, billed per hour), us-central1.
  # scripts/vertex_deploy_run_teardown.sh deploys, exports the endpoint URL, runs, and deletes it.
  # Both use one vLLM image and the llama3_json tool parser, like the DeltaAI script.
  llama31_8b_vertex:
    provider: vertex_openai
    model: meta-llama/Llama-3.1-8B-Instruct
    base_url_env: VERTEX_LLAMA31_8B_URL
    project_env: GOOGLE_CLOUD_PROJECT

  llama31_70b_vertex:
    provider: vertex_openai
    model: meta-llama/Llama-3.1-70B-Instruct
    base_url_env: VERTEX_LLAMA31_70B_URL
    project_env: GOOGLE_CLOUD_PROJECT

judge:
  # gpt-oss-120b on Vertex AI (same judge model as the earlier Groq setup; neither tested model).
  # Auth: gcloud ADC, like gemini35_flash.
  provider: vertex_openai
  model: openai/gpt-oss-120b-maas
  location: global
  project_env: GOOGLE_CLOUD_PROJECT
  extra_body: {reasoning_effort: low}
  concurrency: 16
  max_tokens: 1000         # gpt-oss reasons first; its reasoning counts toward max_tokens
  # Groq alternative (free tier):
  #   provider: openai / model: openai/gpt-oss-120b / base_url: https://api.groq.com/openai/v1
  #   api_key_env: GROQ_API_KEY / extra_body: {reasoning_effort: low, include_reasoning: false}
  #   concurrency: 4 / max_tokens: 300
  # For the real study the README suggests gpt-4o-mini (base_url: null, api_key_env: OPENAI_API_KEY).
